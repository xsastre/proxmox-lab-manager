# config/nginx-default.conf
server {
    listen 80 default_server;
    root /var/www/html;
    index index.html;

    # 1. Proxy per a l'API de Proxmox VE
    location /api2/ {
        proxy_pass https://192.168.2.124:8006/api2/;
        proxy_ssl_verify off;
        proxy_set_header Host 192.168.2.124:8006;
    }

    # 2. Proxy dinàmic per a l'API REST de MikroTik CHR
    location ~ ^/mikrotik-rest/(.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $mt_target $http_x_mikrotik_url;
        
        # Redirigim la petició cap a la IP del MikroTik especificada a la capçalera
        proxy_pass $mt_target/rest/$1$is_args$args;
        proxy_ssl_verify off;
        proxy_set_header Authorization $http_authorization;
    }

    # 3. Proxy per al backend local Flask (Base de dades SQLite)
    location /api/local/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
